<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="VOLTCORE Command Center — live ingest observability." />
  <title>VOLTCORE Command Center</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <p class="kicker">VOLTCORE // OBSERVABILITY</p>
        <h1>Command Center</h1>
      </div>
      <div class="top-actions">
        <span id="livePill" class="pill off">OFFLINE</span>
        <button id="refreshBtn" type="button" aria-label="Refresh events">↻</button>
      </div>
    </div>
  </header>
  <main>
    <section class="stats">
      <article><span>INGESTED</span><strong id="statCount">0</strong></article>
      <article class="danger"><span>ANOMALIES</span><strong id="statAnom">0</strong></article>
      <article><span>SOURCES</span><strong id="statSources">0</strong></article>
      <article><span>LAST EVENT</span><strong id="statLast">—</strong></article>
    </section>
    <p id="errorBox" class="error" hidden></p>
    <section class="filters">
      <input id="search" type="search" placeholder="Search source, type, payload" />
      <div id="sevChips" class="chips"></div>
      <div id="srcChips" class="chips"></div>
      <p id="meta" class="meta">awaiting sync</p>
    </section>
    <section>
      <ul id="list" class="list"></ul>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
